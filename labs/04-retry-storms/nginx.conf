worker_processes 2;
events { worker_connections 8192; }
http {
  access_log off;
  upstream api {
    server api1:8080;
    server api2:8080;
    keepalive 128;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Nginx can retry too ("error timeout" is its default). Off here so only the
      # client and the api retry. Turning it on is an exercise in the README.
      proxy_next_upstream off;
    }
  }
}
